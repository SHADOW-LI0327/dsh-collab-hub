<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collab Hub · 协作看板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login" class="login">
    <div class="login-card">
      <div class="brand">Collab Hub</div>
      <p class="muted">团队共享的 feature 上下文：谁在做什么、设计产物、待回答问题。</p>
      <form id="register-form" class="stack">
        <label>名字<input name="name" required maxlength="40" placeholder="A / 小张"></label>
        <label>角色<input name="role" maxlength="40" placeholder="frontend / backend / pm"></label>
        <button type="submit">注册并加入</button>
      </form>
      <details class="token-details">
        <summary>已有 token</summary>
        <form id="token-form" class="stack">
          <label>成员 token<input name="token" required placeholder="col_..."></label>
          <button type="submit" class="secondary">使用 token</button>
        </form>
      </details>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <section id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">Collab Hub</div>
      <div class="topbar-right">
        <span id="me" class="me"></span>
        <button id="logout" class="secondary small" type="button">退出</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="section-head">
          <span>项目</span>
          <button id="new-project-toggle" class="small" type="button">+ 项目</button>
        </div>
        <div id="projects" class="project-list"></div>
        <form id="project-form" class="stack card" hidden>
          <label>ID<input name="id" required placeholder="shop"></label>
          <label>名称<input name="name" required placeholder="电商平台"></label>
          <label>仓库（逗号分隔）<input name="repos" placeholder="web,api"></label>
          <button type="submit">创建项目</button>
          <button type="button" class="secondary" data-cancel="project-form">取消</button>
        </form>

        <div class="section-head features-head">
          <span>Feature</span>
          <button id="new-feature-toggle" class="small" type="button" disabled>+ Feature</button>
        </div>
        <div id="features" class="feature-list"></div>
        <form id="feature-form" class="stack card" hidden>
          <label>ID<input name="id" required placeholder="FEAT-001"></label>
          <label>标题<input name="title" required placeholder="退款流程"></label>
          <label>仓库（逗号分隔）<input name="repos" placeholder="web,api"></label>
          <label>目标 / 非目标<textarea name="brief" rows="3"></textarea></label>
          <button type="submit">创建 Feature</button>
          <button type="button" class="secondary" data-cancel="feature-form">取消</button>
        </form>
      </aside>

      <main id="detail" class="detail">
        <div class="empty">选择或创建一个 feature。</div>
      </main>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
